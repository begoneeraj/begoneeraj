<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Pushpraj's build arcade</title><desc id="desc">A mint comet loops through four project checkpoints: TruthLens, ImportSafe, Life RPG and Decoy Drop. A decorative animation inspired by classic arcade games.</desc>
<style>
@keyframes travel{0%{transform:translate(130px,185px)}25%{transform:translate(440px,185px)}50%{transform:translate(750px,185px)}75%{transform:translate(1060px,185px)}80%{transform:translate(1110px,250px)}90%{transform:translate(90px,250px)}100%{transform:translate(130px,185px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.ship{animation:travel 14s linear infinite;transform:translate(130px,185px)}.beacon{animation:pulse 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.ship,.beacon{animation:none}}
</style>
